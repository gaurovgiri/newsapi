name: Scrape News & Sync to Hugging Face

on:
  # Run every 4 hours
  schedule:
    - cron: '0 */4 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to test changes
  push:
    branches: [ main, master ]
    paths:
      - 'main.py'
      - 'hf_sync.py'
      - 'news_source.py'
      - 'sources/**'
      - 'requirements.txt'
      - '.github/workflows/scrape-news.yml'

jobs:
  scrape-and-sync:
    name: Scrape News & Push to Hugging Face
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run News Scraper & Hugging Face Sync
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO_ID: ${{ vars.HF_REPO_ID || secrets.HF_REPO_ID || 'thegauravgiri/nepali-news-dataset' }}
      run: |
        python main.py
    
    - name: Upload temporary debug artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: news-data-run-${{ github.run_number }}
        path: data/
        retention-days: 3
